# Example Render Blueprint. Add TELEGRAM_BOT_TOKEN in the dashboard as a secret.
services:
  - type: worker
    name: signalbazan-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: MAX_SYMBOLS
        value: "40"
      - key: MIN_SCORE
        value: "4"
